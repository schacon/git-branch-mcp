[package]
name = "git-branch-mcp"
version = "1.0.0"
edition = "2021"
authors = ["Scott Chacon <schacon@gmail.com>"]
description = "An implementation of the Model Context Protocol (MCP) server for Git branch operations"

[lib]
name = "git_branch_mcp"
path = "src/lib.rs"

[[bin]]
name = "git-branch-mcp"
path = "src/main.rs"

[dependencies]
async-openai = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"
tempfile = "3.0"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"